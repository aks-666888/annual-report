<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2025 年度报告</title>
<style>
/* Design Tokens - Dark Default */
:root {
  --bg-primary: #150f23;
  --bg-secondary: #1f1633;
  --bg-card: rgba(31,22,51,0.7);
  --text-primary: #f0f0f0;
  --text-secondary: #a0a0a0;
  --accent: #c2ef4e;
  --accent-secondary: #8b5cf6;
  --accent-tertiary: #f472b6;
  --accent-quaternary: #38bdf8;
  --accent-quinary: #fbbf24;
  --accent-senary: #f87171;
  --border: rgba(255,255,255,0.1);
  --glow: 0 0 20px rgba(194,239,78,0.3);
  --grid: linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
          linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
}

/* Light Theme Override */
:root[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-card: rgba(248,250,252,0.9);
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --accent: #166534;
  --border: rgba(0,0,0,0.1);
  --glow: 0 0 20px rgba(22,101,52,0.2);
  --grid: linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),
          linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
}

/* Accent Colors */
:root[data-accent="lime"] { --accent: #c2ef4e; }
:root[data-accent="cyan"] { --accent: #22d3ee; }
:root[data-accent="amber"] { --accent: #fbbf24; }
:root[data-accent="violet"] { --accent: #8b5cf6; }
:root[data-accent="rose"] { --accent: #f472b6; }
:root[data-accent="blue"] { --accent: #3b82f6; }

/* Layout Presets */
:root[data-preset="magazine"] {
  --font-heading: Georgia,'Times New Roman',serif;
}
:root[data-preset="poster"] {
  --font-scale: 1.4;
}
:root[data-preset="deck"] {
  --card-max-width: none;
}

/* Base */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Magazine Preset Override */
body[data-preset="magazine"] .hero-title {
  font-family: Georgia,'Times New Roman',serif;
  text-align: left;
  font-size: 3.5rem;
}
body[data-preset="magazine"] .hero {
  align-items: flex-start;
  padding-left: 10%;
}
body[data-preset="magazine"] .badge {
  position: relative;
  border-left: 4px solid var(--accent);
  padding-left: 1rem;
}

/* Poster Preset Override */
body[data-preset="poster"] .hero-title {
  font-size: 4rem;
}
body[data-preset="poster"] .card-value {
  font-size: 2.5rem;
}
body[data-preset="poster"] .section-title {
  font-size: 3rem;
}

/* Deck Preset - Horizontal Scroll */
body[data-preset="deck"] main {
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
}
body[data-preset="deck"] section {
  flex: 0 0 100vw;
  max-width: none;
  scroll-snap-align: start;
  padding: 80px 10%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Background */
.bg-grid {
  position: fixed;
  inset: 0;
  background: var(--grid);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: -1;
}

.bg-glow {
  position: fixed;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle,rgba(194,239,78,0.1) 0%,transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  animation: float 20s infinite ease-in-out;
}

@keyframes float {
  0%,100% { transform: translate(-50%,-50%) rotate(0deg); }
  50% { transform: translate(-30%,-30%) rotate(180deg); }
}

/* Navigation */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: rgba(21,15,35,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 2rem;
  z-index: 100;
}

nav a {
  color: var(--text-secondary);
  text-decoration: none;
  margin-right: 1.5rem;
  font-size: 0.9rem;
  transition: color 0.3s;
}

nav a:hover, nav a.active {
  color: var(--accent);
}

/* Theme & Preset Buttons */
.btn-icon {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 0.4rem 0.8rem;
  margin-left: auto;
  cursor: pointer;
  border-radius: 6px;
  font-size: 0.85rem;
  transition: all 0.3s;
}

.btn-icon:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Progress Bar */
.progress-bar {
  position: fixed;
  top: 60px;
  left: 0;
  height: 2px;
  background: var(--accent);
  width: 0%;
  z-index: 99;
  transition: width 0.1s;
}

/* Hero */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  position: relative;
}

.hero-title {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(135deg,var(--accent),var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 1rem;
  animation: fadeInUp 0.8s ease-out;
}

.hero-subtitle {
  font-size: 1.5rem;
  color: var(--text-secondary);
  margin-bottom: 2rem;
  animation: fadeInUp 0.8s ease-out 0.2s backwards;
}

.badge {
  display: inline-block;
  background: rgba(194,239,78,0.1);
  color: var(--accent);
  padding: 0.5rem 1rem;
  border-radius: 50px;
  font-size: 0.9rem;
  animation: fadeInUp 0.8s ease-out 0.4s backwards;
  border: 1px solid rgba(194,239,78,0.3);
}

/* Sections */
section {
  padding: 80px 10%;
  max-width: 1400px;
  margin: 0 auto;
}

.section-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 2rem;
  color: var(--text-primary);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s ease-out;
}

section.is-visible .section-title {
  opacity: 1;
  transform: translateY(0);
}

/* Metrics Grid */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
  gap: 1.5rem;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
  opacity: 0;
  transform: translateY(20px);
}

section.is-visible .card {
  opacity: 1;
  transform: translateY(0);
}

.card:hover {
  border-color: var(--accent);
  box-shadow: var(--glow);
}

.card-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}

.card-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 0.5rem;
}

.card-unit {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-left: 0.3rem;
}

.card-delta {
  font-size: 0.85rem;
  color: var(--accent-secondary);
}

.card-prev {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 0.3rem;
}

/* Growth Chart */
.growth-chart {
  width: 100%;
  height: 400px;
  margin-top: 2rem;
  position: relative;
}

.growth-tooltip {
  position: absolute;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.8rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 10;
  font-size: 0.85rem;
}

.growth-tooltip.visible {
  opacity: 1;
}

.growth-legend {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1rem;
  justify-content: center;
}

.growth-legend-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.growth-legend-color {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

/* Timeline */
.timeline {
  position: relative;
  padding-left: 2rem;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  margin-bottom: 2rem;
  padding-left: 1.5rem;
  opacity: 0;
  transform: translateX(-20px);
  transition: all 0.6s ease-out;
}

section.is-visible .timeline-item {
  opacity: 1;
  transform: translateX(0);
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -2.35rem;
  top: 0.5rem;
  width: 12px;
  height: 12px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
}

.timeline-quarter {
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 0.3rem;
}

.timeline-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 0.3rem;
}

.timeline-detail {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

/* Features Chart */
.features-chart {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  margin-top: 2rem;
}

.donut-container {
  position: relative;
  width: 300px;
  height: 300px;
}

.donut-segment {
  transition: stroke-width 0.3s;
  cursor: pointer;
}

.donut-segment:hover {
  stroke-width: 35;
}

.features-legend {
  max-width: 300px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.8rem;
  padding: 0.5rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.3s;
}

.legend-item:hover {
  background: rgba(255,255,255,0.05);
}

.legend-color {
  width: 16px;
  height: 16px;
  border-radius: 4px;
}

.legend-label {
  flex: 1;
  font-size: 0.95rem;
}

.legend-value {
  font-weight: 600;
  color: var(--accent);
}

.bar-view {
  display: none;
  width: 100%;
  max-width: 500px;
  margin-top: 2rem;
}

.bar-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  opacity: 0;
  transform: translateX(-20px);
  animation: slideIn 0.6s ease-out forwards;
}

.bar-label {
  width: 100px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.bar-fill {
  flex: 1;
  height: 30px;
  background: var(--bg-secondary);
  border-radius: 6px;
  overflow: hidden;
}

.bar-progress {
  height: 100%;
  border-radius: 6px;
  width: 0;
  transition: width 1s ease-out;
}

@keyframes slideIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Gaps Section */
.gaps-section {
  background: rgba(245,158,11,0.05);
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: 12px;
  padding: 1.5rem;
  margin-top: 2rem;
}

.gap-item {
  display: flex;
  align-items: flex-start;
  gap: 0.8rem;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.gap-item:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}

.gap-icon {
  color: #fbbf24;
  font-size: 1.2rem;
}

.gap-text {
  flex: 1;
}

.gap-title {
  font-weight: 600;
  margin-bottom: 0.3rem;
}

.gap-how {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

/* Export Button */
.export-btn {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  padding: 0.8rem 1.5rem;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--glow);
  transition: all 0.3s;
  z-index: 100;
}

.export-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 30px var(--accent);
}

/* Animations */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Print */
@media print {
  body {
    background: #fff;
    color: #000;
  }
  nav, .export-btn, .progress-bar {
    display: none;
  }
  .card {
    break-inside: avoid;
    border: 1px solid #ccc;
  }
  section {
    page-break-inside: avoid;
  }
  body[data-preset="deck"] main {
    display: block;
    overflow: visible;
  }
  body[data-preset="deck"] section {
    flex: none;
    width: auto;
    scroll-snap: none;
    min-height: auto;
  }
}

/* Responsive */
@media (max-width: 768px) {
  .hero-title {
    font-size: 2rem;
  }
  .hero-subtitle {
    font-size: 1.1rem;
  }
  .metrics-grid {
    grid-template-columns: 1fr;
  }
  .features-chart {
    flex-direction: column;
  }
  section {
    padding: 40px 5%;
  }
}
</style>
</head>
<body data-accent="violet" data-preset="dashboard" data-theme="dark">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <nav>
    <a href="#hero" class="active">首页</a>
    <a href="#metrics">指标</a>
    <a href="#growth">增长</a>
    <a href="#milestones">里程碑</a>
    <a href="#features">功能</a>
    <a href="#team">团队</a>
    <a href="#outlook">展望</a>
    <select id="presetBtn" class="btn-icon">
      <option value="dashboard">仪表盘</option>
      <option value="magazine">杂志</option>
      <option value="poster">海报</option>
      <option value="deck">横屏</option>
    </select>
    <button id="themeBtn" class="btn-icon">浅色</button>
  </nav>

  <div class="progress-bar"></div>

  <main id="hero" class="hero">
    <h1 class="hero-title" id="reportTitle">2025 年度报告</h1>
    <p class="hero-subtitle" id="reportSubtitle">星图 SaaS 产品线成果回顾</p>
    <div class="badge" id="reportPeriod">2025年1月-12月</div>
  </main>

  <section id="metrics" class="section">
    <h2 class="section-title">核心指标</h2>
    <div class="metrics-grid" id="metricsGrid"></div>
  </section>

  <section id="growth" class="section">
    <h2 class="section-title">用户增长</h2>
    <div class="growth-legend" id="growthLegend"></div>
    <div class="growth-chart" id="growthChart">
      <svg id="growthSvg" width="100%" height="100%"></svg>
      <div class="growth-tooltip" id="growthTooltip"></div>
    </div>
  </section>

  <section id="milestones" class="section">
    <h2 class="section-title">产品里程碑</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="features" class="section">
    <h2 class="section-title">功能使用分布</h2>
    <div class="features-chart">
      <div class="donut-container">
        <svg id="donutSvg" width="300" height="300"></svg>
      </div>
      <div class="features-legend" id="featuresLegend"></div>
    </div>
    <div class="bar-view" id="barView"></div>
  </section>

  <section id="team" class="section">
    <h2 class="section-title">团队亮点</h2>
    <div class="metrics-grid" id="teamGrid"></div>
  </section>

  <section id="outlook" class="section">
    <h2 class="section-title">展望 2026</h2>
    <div class="metrics-grid" id="outlookGrid"></div>
  </section>

  <section id="gaps" class="section" style="display:none;">
    <h2 class="section-title">数据补全建议</h2>
    <div class="gaps-section" id="gapsList"></div>
  </section>

  <button class="export-btn" id="exportBtn">导出 PDF</button>

  <script>
(function() {
  // Data
  const DATA = {
    meta: { title: "2025 年度报告", subtitle: "星图 SaaS 产品线成果回顾", period: "2025年1月-12月", accent: "violet", preset: "dashboard" },
    metrics: [
      { label: "月活跃用户", value: 620, unit: "万", prev: 450, delta: "+38%" },
      { label: "API 调用", value: 52, unit: "亿", prev: 18, delta: "+189%" },
      { label: "可用性", value: 99.97, unit: "%", prev: 99.95, delta: "+0.02%" },
      { label: "NPS", value: 64, unit: "分", prev: 58, delta: "+6" },
      { label: "付费客户", value: 1280, unit: "家", prev: 890, delta: "+44%" },
      { label: "总收入", value: 1.8, unit: "亿", prev: 1.1, delta: "+64%" }
    ],
    growth: {
      caption: "月活跃用户（MAU）",
      labels: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
      series: [
        { label: "2023", data: [0.8, 0.9, 1.0, 1.1, 1.2, 1.4, 1.5, 1.6, 1.7, 1.8, 2.0, 2.2], color: "#666", dash: true },
        { label: "2024", data: [1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.5, 3.8, 4.2, 4.5], color: "#999", dash: true },
        { label: "2025", data: [3.3, 3.7, 4.2, 4.6, 5.0, 5.5, 5.8, 6.1, 6.3, 6.4, 6.4, 6.55], color: "#c2ef4e" }
      ]
    },
    milestones: [
      { quarter: "Q1", title: "重构核心服务", detail: "性能提升 40%，延迟降低 150ms" },
      { quarter: "Q2", title: "上线数据分析", detail: "覆盖 80% 核心业务场景" },
      { quarter: "Q3", title: "开放 API 平台", detail: "首月调用破 10 亿次" },
      { quarter: "Q4", title: "国际化启动", detail: "支持英文/西班牙语界面" }
    ],
    features: [
      { label: "数据分析", value: 35 },
      { label: "实时监控", value: 28 },
      { label: "告警通知", value: 20 },
      { label: "报表导出", value: 12 },
      { label: "自定义仪表盘", value: 5 }
    ],
    team: [
      { label: "工程", achievement: "重构 50+ 核心模块，性能提升 40%" },
      { label: "产品", achievement: "完成 12 个版本迭代，用户满意度达 4.8/5" },
      { label: "设计", achievement: "统一设计系统，交付 200+ 组件" },
      { label: "运营", achievement: "组织 4 场技术沙龙，覆盖 500+ 开发者" }
    ],
    outlook: [
      { title: "深化数据分析", detail: "增强预测与异常检测能力" },
      { title: "拓展生态", detail: "与 5 家头部 SaaS 厂商深度集成" },
      { title: "全球化", detail: "支持 10 种语言，覆盖 20 个国家" }
    ],
    gaps: []
  };

  // Theme Colors
  const COLORS = ['#c2ef4e', '#8b5cf6', '#f472b6', '#38bdf8', '#fbbf24', '#f87171'];

  // Init
  function init() {
    // Set meta
    document.body.setAttribute('data-accent', DATA.meta.accent || 'lime');
    document.body.setAttribute('data-preset', DATA.meta.preset || 'dashboard');
    document.getElementById('reportTitle').textContent = DATA.meta.title || '年度报告';
    document.getElementById('reportSubtitle').textContent = DATA.meta.subtitle || '';
    document.getElementById('reportPeriod').textContent = DATA.meta.period || '';

    // Restore theme
    const savedTheme = localStorage.getItem('report-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '浅色' : '深色';

    // Restore preset
    const savedPreset = localStorage.getItem('report-preset') || 'dashboard';
    document.body.setAttribute('data-preset', savedPreset);
    document.getElementById('presetBtn').value = savedPreset;

    // Render sections
    renderMetrics();
    renderGrowth();
    renderMilestones();
    renderFeatures();
    renderTeam();
    renderOutlook();
    renderGaps();

    // Event listeners
    setupEventListeners();
    setupObserver();
  }

  function renderMetrics() {
    const grid = document.getElementById('metricsGrid');
    if (!DATA.metrics || !grid) return;

    grid.innerHTML = DATA.metrics.map(m => `
      <div class="card">
        <div class="card-label">${m.label}</div>
        <div class="card-value">${typeof m.value === 'number' ? m.value.toLocaleString() : m.value}<span class="card-unit">${m.unit || ''}</span></div>
        ${m.delta ? `<div class="card-delta">${m.delta}</div>` : ''}
        ${m.prev !== undefined ? `<div class="card-prev">上年/前期: ${m.prev}${m.unit || ''}</div>` : ''}
      </div>
    `).join('');
  }

  function renderGrowth() {
    if (!DATA.growth || !DATA.growth.series || !DATA.growth.series.length) return;

    // Render legend
    const legend = document.getElementById('growthLegend');
    legend.innerHTML = DATA.growth.series.map(s => `
      <div class="growth-legend-item">
        <div class="growth-legend-color" style="background:${s.color};${s.dash?'border:2px dashed '+s.color:'border:2px solid '+s.color}"></div>
        <span>${s.label}</span>
      </div>
    `).join('');

    // Build line chart
    buildLine();
  }

  function buildLine() {
    const svg = document.getElementById('growthSvg');
    const tooltip = document.getElementById('growthTooltip');
    const labels = DATA.growth.labels;
    const series = DATA.growth.series;
    const padding = { top: 20, right: 20, bottom: 30, left: 40 };
    const width = svg.clientWidth;
    const height = svg.clientHeight;

    // Clear
    svg.innerHTML = '';

    // Calculate scales
    const allValues = series.flatMap(s => s.data);
    const maxY = Math.max(...allValues) * 1.1;
    const maxX = labels.length - 1;

    const x = i => padding.left + (i / maxX) * (width - padding.left - padding.right);
    const y = v => height - padding.bottom - (v / maxY) * (height - padding.top - padding.bottom);

    // Draw grid
    for (let i = 0; i <= 5; i++) {
      const val = (maxY / 5) * i;
      const yPos = y(val);
      svg.innerHTML += `<line x1="${padding.left}" y1="${yPos}" x2="${width - padding.right}" y2="${yPos}" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4"/>`;
      svg.innerHTML += `<text x="${padding.left - 5}" y="${yPos + 4}" text-anchor="end" fill="var(--text-secondary)" font-size="11">${val.toFixed(1)}</text>`;
    }

    // Draw X labels
    labels.forEach((lbl, i) => {
      svg.innerHTML += `<text x="${x(i)}" y="${height - 10}" text-anchor="middle" fill="var(--text-secondary)" font-size="11">${lbl}</text>`;
    });

    // Draw lines
    series.forEach((s, si) => {
      const points = s.data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M${points}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', s.color);
      path.setAttribute('stroke-width', '2');
      if (s.dash) {
        path.setAttribute('stroke-dasharray', '5,5');
      }
      svg.appendChild(path);

      // Draw points
      s.data.forEach((v, i) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x(i));
        circle.setAttribute('cy', y(v));
        circle.setAttribute('r', '4');
        circle.setAttribute('fill', s.color);
        circle.style.cursor = 'pointer';
        svg.appendChild(circle);
      });
    });

    // Mouse interaction
    svg.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const idx = Math.round(((mouseX - padding.left) / (width - padding.left - padding.right)) * maxX);

      if (idx >= 0 && idx < labels.length) {
        let html = `<strong>${labels[idx]}</strong><br/>`;
        series.forEach(s => {
          html += `${s.label}: ${s.data[idx]}<br/>`;
        });
        tooltip.innerHTML = html;
        tooltip.style.left = (x(idx) + 10) + 'px';
        tooltip.style.top = (y(series[0].data[idx]) - 50) + 'px';
        tooltip.classList.add('visible');
      }
    });

    svg.addEventListener('mouseleave', () => {
      tooltip.classList.remove('visible');
    });
  }

  function renderMilestones() {
    const timeline = document.getElementById('timeline');
    if (!DATA.milestones || !timeline) return;

    timeline.innerHTML = DATA.milestones.map((m, i) => `
      <div class="timeline-item" style="transition-delay:${i * 0.1}s">
        <div class="timeline-quarter">${m.quarter}</div>
        <div class="timeline-title">${m.title}</div>
        <div class="timeline-detail">${m.detail}</div>
      </div>
    `).join('');
  }

  function renderFeatures() {
    if (!DATA.features || !DATA.features.length) return;

    const svg = document.getElementById('donutSvg');
    const legend = document.getElementById('featuresLegend');
    const total = DATA.features.reduce((s, f) => s + f.value, 0);
    let currentAngle = 0;

    // Draw donut
    DATA.features.forEach((f, i) => {
      const angle = (f.value / total) * 360;
      const startAngle = currentAngle;
      const endAngle = currentAngle + angle;
      const x1 = 150 + 120 * Math.cos(Math.PI * startAngle / 180);
      const y1 = 150 + 120 * Math.sin(Math.PI * startAngle / 180);
      const x2 = 150 + 120 * Math.cos(Math.PI * endAngle / 180);
      const y2 = 150 + 120 * Math.sin(Math.PI * endAngle / 180);

      const largeArc = angle > 180 ? 1 : 0;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M 150 150 L ${x1} ${y1} A 120 120 0 ${largeArc} 1 ${x2} ${y2} Z`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', COLORS[i % COLORS.length]);
      path.setAttribute('stroke-width', '30');
      path.setAttribute('class', 'donut-segment');
      path.dataset.index = i;
      svg.appendChild(path);

      currentAngle += angle;
    });

    // Draw legend
    legend.innerHTML = DATA.features.map((f, i) => `
      <div class="legend-item" data-index="${i}">
        <div class="legend-color" style="background:${COLORS[i % COLORS.length]}"></div>
        <div class="legend-label">${f.label}</div>
        <div class="legend-value">${f.value}%</div>
      </div>
    `).join('');

    // Build bar view
    const barView = document.getElementById('barView');
    barView.innerHTML = DATA.features.map((f, i) => `
      <div class="bar-item" style="animation-delay:${i * 0.1}s">
        <div class="bar-label">${f.label}</div>
        <div class="bar-fill">
          <div class="bar-progress" style="width:0%;background:${COLORS[i % COLORS.length]}" data-width="${f.value}%"></div>
        </div>
        <div class="legend-value" style="min-width:40px;text-align:right">${f.value}%</div>
      </div>
    `).join('');
  }

  function renderTeam() {
    const grid = document.getElementById('teamGrid');
    if (!DATA.team || !grid) return;

    grid.innerHTML = DATA.team.map(t => `
      <div class="card">
        <div class="card-label" style="font-weight:600;color:var(--accent)">${t.label}</div>
        <div class="card-value" style="font-size:1.1rem">${t.achievement}</div>
      </div>
    `).join('');
  }

  function renderOutlook() {
    const grid = document.getElementById('outlookGrid');
    if (!DATA.outlook || !grid) return;

    grid.innerHTML = DATA.outlook.map(o => `
      <div class="card" style="border-left:3px solid var(--accent)">
        <div class="card-value" style="font-size:1.2rem;margin-bottom:0.5rem">${o.title}</div>
        <div class="card-label">${o.detail}</div>
      </div>
    `).join('');
  }

  function renderGaps() {
    const section = document.getElementById('gaps');
    const list = document.getElementById('gapsList');

    const autoGaps = computeGaps();
    const allGaps = [...autoGaps, ...(DATA.gaps || [])];

    if (allGaps.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    list.innerHTML = allGaps.map(g => `
      <div class="gap-item">
        <div class="gap-icon">💡</div>
        <div class="gap-text">
          <div class="gap-title">${g.item}</div>
          ${g.how ? `<div class="gap-how">如何获取: ${g.how}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function computeGaps() {
    const gaps = [];
    if (!DATA.metrics || !DATA.metrics.length) gaps.push({ item: '核心指标缺失', how: '补充至少1-3个关键指标（如用户数、收入、NPS）即可生成指标卡' });
    if (!DATA.growth || !DATA.growth.data || !DATA.growth.data.length) gaps.push({ item: '增长曲线缺失', how: '补充月度/季度数据序列（如1-12月数值）即可生成增长图' });
    if (!DATA.milestones || !DATA.milestones.length) gaps.push({ item: '里程碑缺失', how: '补充关键事件+季度/时间即可生成时间线' });
    if (!DATA.features || !DATA.features.length) gaps.push({ item: '功能分布缺失', how: '补充功能名+占比即可生成环形图' });
    if (!DATA.team || !DATA.team.length) gaps.push({ item: '团队亮点缺失', how: '补充职能+成就即可生成团队卡' });
    if (!DATA.outlook || !DATA.outlook.length) gaps.push({ item: '展望缺失', how: '补充明年方向即可生成展望区' });
    return gaps;
  }

  function setupEventListeners() {
    // Theme toggle
    document.getElementById('themeBtn').addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      document.getElementById('themeBtn').textContent = next === 'dark' ? '浅色' : '深色';
      localStorage.setItem('report-theme', next);
    });

    // Preset toggle
    document.getElementById('presetBtn').addEventListener('change', (e) => {
      const preset = e.target.value;
      document.body.setAttribute('data-preset', preset);
      localStorage.setItem('report-preset', preset);
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      window.print();
    });

    // Resize handler
    window.addEventListener('resize', () => {
      buildLine();
    });
  }

  function setupObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');

          // Animate bar progress
          if (entry.target.id === 'features') {
            setTimeout(() => {
              document.querySelectorAll('.bar-progress').forEach(bar => {
                bar.style.width = bar.dataset.width;
              });
            }, 300);
          }
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('section').forEach(section => {
      observer.observe(section);
    });

    // Progress bar
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.querySelector('.progress-bar').style.width = scrolled + '%';
    });
  }

  // Run
  init();
})();
  </script>
</body>
</html>
